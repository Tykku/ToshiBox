name: Publish

on:
  push:
    tags:
      - '*.*.*.*'

jobs:
  Build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Get Tag
        run: echo "tag=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud Latest
        run: |
          wget -O /tmp/dalamud.zip https://github.com/goatcorp/dalamud-distrib/raw/main/stg/latest.zip
          unzip -o /tmp/dalamud.zip -d /tmp/dalamud

      - name: Restore Nuget Packages
        run: dotnet restore ToshiBox/ToshiBox.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release ToshiBox/ToshiBox.csproj -p:AssemblyVersion=${{ env.tag }} -p:FileVersion=${{ env.tag }} -p:PackageVersion=${{ env.tag }} -p:InformationalVersion=${{ env.tag }} -p:DalamudLibPath=/tmp/dalamud/ --output ./build

      - name: Zip Plugin
        run: cd ./build && zip ToshiBox.zip *

      - name: Publish Plugin to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          body: "Auto-published version ${{ env.tag }}"
          files: ./build/ToshiBox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest.toml
        run: |
          cat > ./release/manifest.toml << EOF
          [plugin]
          internal_name = "ToshiBox"
          display_name = "ToshiBox"
          author = "Toshi"
          description = "My own playground for plugin dev"
          punchline = "Hello there"
          repo_url = "https://github.com/Tykku/ToshiBox"
          tags = ["ToshiBox"]
          icon_url = "https://raw.githubusercontent.com/Tykku/ToshiBox/main/release/images/icon.png"
          assembly_version = "${{ env.tag }}"
          dalamud_api_level = 12
          download_link_install = "https://raw.githubusercontent.com/Tykku/ToshiBox/main/release/ToshiBox.zip"
          changelog = "Auto-published version ${{ env.tag }}"
          EOF

      - name: Copy Built Files to Release Folder
        run: cp ./build/ToshiBox.zip ./release/ToshiBox.zip

      - name: Generate pluginmaster.json with Python script
        run: python3 generate_pluginmaster.py

      - name: Commit and Push to main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://github-actions:${{ secrets.GITHUB_TOKEN }}@github.com/Tykku/ToshiBox.git
          git add release/ pluginmaster.json
          git commit -m "Update pluginmaster.json and release files for ${{ env.tag }}" || echo "No changes to commit"
          git push origin main
